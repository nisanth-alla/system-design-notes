name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  experiments:
    name: Experiments typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: experiments/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

  visualizations:
    name: Visualizations build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: visualizations
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: visualizations/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
